name: Paper Trading Automation Engine

on:
  schedule:
    # 1. Evening Sheet Fetch: 12:30 UTC (18:00 IST)
    - cron: '30 12 * * *'
    # 2. Daily 6:30 PM IST Report (Portfolio Status, Trades & Top Breakouts): 13:00 UTC (18:30 IST)
    - cron: '0 13 * * *'
    # 3. Market Hours Price & Trade Check: Every 15 minutes between 03:45 and 10:00 UTC (09:15 - 15:30 IST) Mon-Fri
    - cron: '45 3 * * 1-5'
    - cron: '*/15 4-9 * * 1-5'
    - cron: '0,15,30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      manual_task:
        description: 'Select Task to Run Manually'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - daily-report
          - fetch-sheets
          - fetch-mail
          - trade-cycle
          - evening-watchlist
          - wyckoff-scan

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine & Execute Task
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_RECIPIENT: ${{ secrets.NOTIFICATION_RECIPIENT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TZ: 'Asia/Kolkata'
        run: |
          CURRENT_HOUR=$(date +%H)
          CURRENT_MIN=$(date +%M)
          DAY_OF_WEEK=$(date +%u)
          MANUAL_INPUT="${{ github.event.inputs.manual_task }}"

          echo "Current IST Time: $(date)"
          echo "Manual Input: $MANUAL_INPUT"

          if [ "$MANUAL_INPUT" == "daily-report" ] || [ "$MANUAL_INPUT" == "evening-watchlist" ]; then
            python scripts/cloud_runner.py --task wyckoff-scan
            python scripts/cloud_runner.py --task daily-report
          elif [ "$MANUAL_INPUT" == "fetch-sheets" ] || [ "$MANUAL_INPUT" == "fetch-mail" ]; then
            python scripts/cloud_runner.py --task fetch-sheets
          elif [ "$MANUAL_INPUT" == "trade-cycle" ]; then
            python scripts/cloud_runner.py --task trade-cycle
          elif [ "$MANUAL_INPUT" == "wyckoff-scan" ]; then
            python scripts/cloud_runner.py --task wyckoff-scan
          else
            # Automated Schedule logic
            # 1. 18:30 IST Window -> Comprehensive Daily Report & Wyckoff Scan
            if [ "$CURRENT_HOUR" -eq 18 ] && [ "$CURRENT_MIN" -ge 25 ]; then
              echo "[+] Triggering Wyckoff Screener & Daily 6:30 PM Report..."
              python scripts/cloud_runner.py --task wyckoff-scan
              python scripts/cloud_runner.py --task daily-report
            elif [ "$CURRENT_HOUR" -ge 17 ] && [ "$CURRENT_HOUR" -le 18 ]; then
              # Evening Sheet Fetch before 18:30 (17:00 - 18:24 IST)
              echo "[+] Triggering Evening Google Sheets Watchlist Fetch & Wyckoff Scan..."
              python scripts/cloud_runner.py --task fetch-sheets
              python scripts/cloud_runner.py --task wyckoff-scan
            fi

            # 2. Trading Hours Window (09:15 to 15:30 IST, Mon-Fri) -> trade cycle
            if [ "$DAY_OF_WEEK" -le 5 ]; then
              if ([ "$CURRENT_HOUR" -eq 9 ] && [ "$CURRENT_MIN" -ge 15 ]) || ([ "$CURRENT_HOUR" -ge 10 ] && [ "$CURRENT_HOUR" -le 14 ]) || ([ "$CURRENT_HOUR" -eq 15 ] && [ "$CURRENT_MIN" -le 30 ]); then
                echo "[+] Triggering Market Hours Trade Cycle..."
                python scripts/cloud_runner.py --task trade-cycle
              fi
            fi
          fi

      - name: Commit & Push Updated Database & Snapshot State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.db data/portfolio_snapshot.json frontend/portfolio_snapshot.json portfolio_snapshot.json data/p2_snapshot.json frontend/p2_snapshot.json p2_snapshot.json
          if git diff --staged --quiet; then
            echo "No database or snapshot changes to commit."
          else
            git commit -m "Auto-update portfolio state & Wyckoff snapshot"
            git push
          fi
